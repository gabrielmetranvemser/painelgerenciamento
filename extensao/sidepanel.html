<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Painel de Atendimento</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; background: #09090b; color: #fafafa;
               font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #quadro { display: block; width: 100%; height: 100%; border: 0; }
  #socorro { position: fixed; inset: auto 0 0 0; padding: 8px 12px;
             background: #18181b; border-top: 1px solid #27272a; font-size: 12px;
             display: flex; gap: 10px; align-items: center; }
  #socorro a { color: #60a5fa; }
  #socorro button { margin-left: auto; background: none; border: 0; color: #a1a1aa;
                    cursor: pointer; font-size: 16px; line-height: 1; }
</style>
</head>
<body>
  <!--
    A extensão apenas exibe o MESMO painel que roda no navegador, numa barra
    lateral. Ela não lê, não toca e não injeta nada no WhatsApp Web — não tem
    nem permissão para isso no manifest. Para a Meta, é invisível.
  -->
  <iframe id="quadro" title="Painel de Atendimento"
          referrerpolicy="no-referrer"
          sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-storage-access-by-user-activation"></iframe>

  <div id="socorro" hidden>
    <span>Não carregou?</span>
    <a id="abrirAba" href="#" target="_blank" rel="noopener">Abrir em uma aba</a>
    <button type="button" id="fechar" title="Esconder">×</button>
  </div>

  <script src="config.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
